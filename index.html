<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Barcode Scanner & Billing System</title>
</head>
<body>
    <div class="container">
        <h1>Shop Barcode Scanner</h1>
        <div id="scanner-section">
            <h2>Scan Product Barcode</h2>
            <div id="my-barcode-reader"></div>
            <button id="start-scanner">Start Scanner</button>
        </div>

        <div id="product-details">
            <h2>Product Details</h2>
            <form id="product-form">
                <label>
                    Barcode:
                    <input type="text" id="barcode" readonly>
                </label>
                <label>
                    Name:
                    <input type="text" id="product-name" required>
                </label>
                <label>
                    Price:
                    <input type="number" id="product-price" step="0.01" required>
                </label>
                <label>
                    Expiry Date:
                    <input type="date" id="product-expiry">
                </label>
                <button type="button" id="add-product">Add Product</button>
            </form>
        </div>

        <div id="bill-section">
            <h2>Generated Bill</h2>
            <ul id="bill-list"></ul>
            <div id="bill-total">Total: $0.00</div>
            <button id="generate-bill">Generate Bill</button>
            <button id="print-bill">Print Bill</button>
        </div>

        <div id="history-section">
            <h2>Bill History</h2>
            <ul id="history-list"></ul>
        </div>
    </div>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <script src="script.js"></script>
</body>
</html>
